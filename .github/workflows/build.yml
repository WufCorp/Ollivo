# Проверка и сборка установщика Windows на каждый push и PR в main.
# Публикация релизов и автообновление — отдельно, вместе с S3 (см. заметку «Фаза 1»).
name: build

on:
  # Правка одного сайта не повод 17 минут собирать установщик: сайт выкладывает pages.yml.
  push:
    branches: [main]
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    branches: [main]
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Репозиторий публичный: попавший в историю ключ увидят все, поэтому каждый push
  # проверяется на секреты. Вся история, а не только новые коммиты, — её мало (2 МБ, 1 с).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        # Закреплённая версия со сверкой SHA256: сканер секретов сам не должен быть подменой.
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose .

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости интерфейса
        run: npm ci

      - name: Проверка типов и сборка интерфейса
        run: npm run build

      - name: Тесты ядра
        working-directory: src-tauri
        # Тесты с настоящими моделями и сетью помечены #[ignore] и здесь не идут.
        run: cargo test --locked

      - name: Установщик NSIS
        # Без подписи обновлений: ключ живёт только у владельца (RELEASE.md), а с включённым
        # createUpdaterArtifacts сборка без ключа падает — так CI и падал до 2026-09-26.
        # Здешний установщик — для проверки, выпуски собираются и подписываются локально.
        run: npx tauri build --config src-tauri/tauri.ci.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: ollivo-setup-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
