[package]
name = "ollivo"
version = "0.0.1"
description = "Ollivo — локальные ИИ-модели в одном окне"
authors = ["WufCorp"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ollivo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nvml-wrapper = "0.13"
sysinfo = "0.39"
thiserror = "2.0.20"
sha2 = "0.11.0"
hex = "0.4.3"
futures-util = "0.3.34"
tokio-util = "0.7.19"
tokio = { version = "1.53.1", features = ["fs", "time", "macros", "sync", "rt-multi-thread"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
